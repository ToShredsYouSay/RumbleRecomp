# RumbleRecomp per-game override for Poke Rumble (USA), disc/title ID WPSE01.
# Loaded automatically by Dolphin's GameConfigLoader from Sys/GameSettings/<id>.ini.

[Core]
# The RVL SDK thread scheduler's idle wait is a tight 3-instruction spin loop at
# 0x802BC270 (inside `SelectThread`; see the Rumble decompilation's symbols.txt):
#   lwz r0, -17688(r13); cmpwi r0,0; bc 12,2,0x802BC270   (spin while flag==0)
# With no interrupt-driven core, StaticRecompCore dispatches this loop natively at full
# host speed instead of blocking, burning ~55-60% of the emulation thread and halving
# the in-stage frame rate (46-51 fps instead of 60). Setting StaticRecompIdlePC makes
# the core call CoreTiming::Idle() here, fast-forwarding to the next scheduled event
# instead of spinning. Verified: title/hub/stage all hold a steady 60 fps afterward.
# Found via: STATICRECOMP_DISPATCH_SAMPLES=1 env var, which prints the hottest guest
# PCs at shutdown ("[staticrecomp] dispatch-site pc=... samples=...").
StaticRecompIdlePC = 0x802bc270
